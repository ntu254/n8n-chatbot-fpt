spring.application.name=chatbot_fptu

# ===============================================
# C?U H�NH K?T N?I DATABASE SUPABASE (POSTGRESQL)
# ===============================================

# C�c gi� tr? n�y gi? ???c ??c t? file .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# C�c c?u h�nh kh�c gi? nguy�n
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==================================
# C?U H�NH GOOGLE OAUTH2
# ==================================
# C�c gi� tr? n�y gi? ???c ??c t? file .env
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Scope gi? nguy�n
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ==================================
# C?U H�NH JWT
# ==================================
jwt.secret=${JWT_SECRET}

# ==================================
# N8N CONFIG
# ==================================
# Set N8N_WEBHOOK_URL environment variable hoặc dùng URL dưới đây
# Ví dụ: https://your-n8n-instance.com/webhook/your-workflow-id
n8n.webhook.url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/rag-ai-agent}
