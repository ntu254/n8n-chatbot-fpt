<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>TuaTua Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>TuaTua Chat</h1>
      <div class="settings">
        <label for="webhookUrl">Webhook URL</label>
        <input id="webhookUrl" type="text" placeholder="https://your-n8n-host/webhook/63917544-ff35-430d-aef1-0c083ba59af1" />
        <button id="saveSettings">Lưu</button>
      </div>
    </header>

    <main id="chat">
      <div id="messages"></div>
    </main>

    <footer>
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="Nhập tin nhắn..."></textarea>
        <button id="send">Gửi</button>
      </div>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
